<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colors the phone's status bar to match the page -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181a16" media="(prefers-color-scheme: dark)">
  <title>The Freedge · Cornell Food Recovery Network</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.jpg">

  <!-- Same fonts as cornellfoodrecoverynetwork.com: Arvo for headings,
       Varela Round for buttons and labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Varela+Round&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo-link" href="https://www.cornellfoodrecoverynetwork.com/" target="_blank" rel="noopener">
      <img class="logo" src="images/frn-logo.jpg" alt="Food Recovery Network" width="450" height="327">
    </a>
    <p class="app-title">The Freedge</p>
    <div class="status-row">
      <p class="subtitle" id="last-updated">Loading…</p>
      <button type="button" class="icon-btn" id="refresh-btn" aria-label="Refresh list">⟳</button>
    </div>
  </header>

  <main>
    <!-- Error messages appear here -->
    <p class="banner" id="error-banner" role="alert" hidden></p>

    <!-- "—— In the fridge now ——" style heading, like the FRN website's -->
    <h1 class="section-heading" id="list-heading">In the fridge now</h1>

    <!-- app.js fills this list with one <li> per item -->
    <ul class="item-list" id="item-list" aria-live="polite"></ul>

    <div class="empty-state" id="empty-state" hidden>
      <div class="bear-badge">
        <img src="images/frn-bear.png" alt="" width="560" height="560">
      </div>
      <p class="empty-title">Nothing in the freedge right now</p>
      <p>Dropping food off? Tap <strong>Add item</strong> so everyone knows.</p>
    </div>

    <footer class="site-footer">
      <p>A project of the
        <a href="https://www.cornellfoodrecoverynetwork.com/" target="_blank" rel="noopener">Cornell Food Recovery Network</a>.
      </p>
    </footer>
  </main>

  <!-- Sticks to the bottom of the screen, where thumbs can reach it -->
  <div class="bottombar">
    <button type="button" class="btn btn-primary btn-block" id="open-add-btn">+ Add item</button>
  </div>

  <!-- The "Add item" form. <dialog> is a built-in HTML popup. -->
  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" novalidate>
      <h2 id="add-title">Add an item</h2>

      <label for="add-name">What is it?</label>
      <input id="add-name" name="name" type="text" maxlength="100"
             placeholder="e.g. Lasagna" autocomplete="off" required>

      <div class="row">
        <div class="field">
          <label for="add-quantity">How many?</label>
          <input id="add-quantity" name="quantity" type="number"
                 inputmode="numeric" min="1" step="1" value="1" required>
        </div>
        <div class="field">
          <label for="add-unit">Unit</label>
          <select id="add-unit" name="unit" required></select>
        </div>
      </div>

      <p class="form-error" id="add-error" role="alert" hidden></p>

      <div class="row actions">
        <button type="button" class="btn" id="cancel-add-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Add to fridge</button>
      </div>
    </form>
  </dialog>

  <!-- Supabase's JavaScript library, then our keys, then our code -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
